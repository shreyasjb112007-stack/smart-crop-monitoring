<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Smart Crop Disease Monitoring</title>
    <style>
        * { box-sizing: border-box; }
        body {
            font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
            margin: 0; background: #f4f7f2; color: #2b2b2b;
        }
        nav {
            background: #2f6e3f; color: white; padding: 14px 28px;
            display: flex; justify-content: space-between; align-items: center;
        }
        nav a { color: white; text-decoration: none; margin-left: 18px; font-size: 14px; }
        nav .brand { font-weight: 600; font-size: 17px; }
        .container { max-width: 900px; margin: 30px auto; padding: 0 20px; }
        .card {
            background: white; border-radius: 10px; padding: 24px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.08); margin-bottom: 20px;
        }
        h1 { font-size: 22px; margin-top: 0; }
        h2 { font-size: 18px; color: #2f6e3f; }
        label { display: block; margin: 12px 0 4px; font-size: 14px; font-weight: 600; }
        input, select, textarea {
            width: 100%; padding: 9px 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px;
        }
        button, .btn {
            background: #2f6e3f; color: white; border: none; padding: 10px 18px;
            border-radius: 6px; font-size: 14px; cursor: pointer; text-decoration: none;
            display: inline-block; margin-top: 14px;
        }
        button:hover, .btn:hover { background: #245530; }
        .btn-secondary { background: #6b7280; }
        .btn-secondary:hover { background: #52565c; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid #eee; font-size: 13px; }
        th { background: #f0f4ee; }
        .flash { padding: 10px 14px; border-radius: 6px; margin-bottom: 14px; font-size: 14px; }
        .flash.success { background: #e3f5e6; color: #1c6b2c; }
        .flash.error { background: #fdeaea; color: #b23131; }
        .badge { padding: 3px 10px; border-radius: 12px; font-size: 12px; font-weight: 600; }
        .badge.Low { background: #e3f5e6; color: #1c6b2c; }
        .badge.Moderate { background: #fff4d9; color: #9a6b0a; }
        .badge.High { background: #fdeaea; color: #b23131; }
        .crop-item { padding: 8px 0; border-bottom: 1px solid #f0f0f0; }
        .empty-state { color: #888; font-size: 14px; padding: 10px 0; }
    </style>
</head>
<body>
    <nav>
        <span class="brand">🌱 Smart Crop Disease Monitoring</span>
        <div>
            
                <a href="/dashboard">Dashboard</a>
                <a href="/reports">Reports</a>
                <a href="/logout">Logout (Demo Farmer)</a>
            
        </div>
    </nav>
    <div class="container">

</body>
</html>
