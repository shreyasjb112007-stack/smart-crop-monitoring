{% extends "base.html" %}
{% block content %}
<div class="card" style="max-width:420px;">
    <h1>Add a Farm</h1>
    <form method="POST">
        <label>Location</label>
        <input type="text" name="location" placeholder="e.g. Vellore, Tamil Nadu" required>
        <label>Area (acres)</label>
        <input type="number" step="0.1" name="area" required>
        <button type="submit">Save Farm</button>
    </form>
</div>
{% endblock %}
